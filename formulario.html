<!DOCTYPE html>
<head>
    <title>Formulário de pesquisa</title>
</head>
<body>
    <h1>Pesquisa de satisfação</h1>
    <form method="post" action="processar-pesquisa.html">
        <section>
            <h2>Dados pessoais</h2>
            <p>
                <label for="nome">Nome:  </label>
                <input type="text" id="nome"/>
            </p>
            <p>
                <label for="email">E-mail:  </label>
                <input type="e-mail" id="email"/>
            </p>
            <p>
                <label for="telefone">Telefone:  </label>
                <input type="tel" id="telefone"/>
            </p>
        </section>
        <section>
            <h2>Dados de pesquisa</h2>
            <p>
                Numa escala de 1 a 5 , como você avalia sua experiência geral?
                <input type="radio" id="1" name="avaliação-experiência"/>
                <label for="1">1</label>
                 <input type="radio" id="2" name="avaliação-experiência"/>
                <label for="2">2</label>
                 <input type="radio" id="3" name="avaliação-experiência"/>
                <label for="3">3</label>
                 <input type="radio" id="4" name="avaliação-experiência"/>
                <label for="4">4</label>
                 <input type="radio" id="5" name="avaliação-experiência"/>
                <label for="5">5</label>
            </p>
            <p>
                Numa escala de 1 a 5, nossa equipe foi clara e prestativa?
                <input type="radio" id="1" name="avaliação-equipe"/>
                <label for="1">1</label>
                 <input type="radio" id="2" name="avaliação-equipe"/>
                <label for="2">2</label>
                 <input type="radio" id="3" name="avaliação-equipe"/>
                <label for="3">3</label>
                 <input type="radio" id="4" name="avaliação-equipe"/>
                <label for="4">4</label>
                 <input type="radio" id="5" name="avaliação-equipe"/>
                <label for="5">5</label>
            </p>
            <p>
                <label for="departamento">Departamento de atendimento: </label> 
                <select>
                    <option>Marketing</option>
                    <option>Financeiro</option>
                    <option>Comercial</option>
                    <option>Administrativo</option>
                    <option>Logistico<option>
                </select>
            </p>
            <p>
                <input type="checkbox" id="compartilhar-dados" />
                <label for="compartilhar-dados">Autorizo compartilhamento de dados com terceiros</label>
            </p>
        </section>
        <imput type="submit" value="Enviar" />
    </form>
</body>
</html>
